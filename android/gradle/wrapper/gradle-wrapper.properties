distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# ⚠️ 刻意停在 9.1.0，没有跟 Flutter 模板升到 9.3.1：
#   1) services.gradle.org 会 302 到 release-assets.githubusercontent.com（GitHub），
#      本机到该域名的 JVM TLS 握手必被打断 → wrapper 永远下不下来（curl 能下，Java 不行）；
#      需要 9.3.1 只能先手工走 http://127.0.0.1:7897 下好再塞进 ~/.gradle/wrapper/dists；
#   2) 9.1.0 正好等于 Flutter 的 warnGradleVersion（gradle_utils.dart），不会触发任何告警；
#   3) ⚠️ 修正：**AGP 9.1.0 要求 Gradle ≥ 9.3.1**（实测报 Minimum supported Gradle version is 9.3.1），
#      所以本机只能停在 AGP 9.0.1（它要求 Gradle ≥ 9.1.0，正好是下面这个版本）。
#      2026-09-30 实测 AGP 9.0.1 + Kotlin 2.4.0 + Gradle 9.1.0 配置阶段与 :app:assembleDebug --dry-run 全通过。
distributionUrl=https\://services.gradle.org/distributions/gradle-9.1.0-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

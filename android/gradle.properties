org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# 固定使用 JDK 21 构建（Gradle 9.1 不支持 JDK 26，避免 Unsupported class file major version 70）
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Gradle 构建优化
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
# R8 full mode（AGP 8.0 起已是默认，留着无害；AGP 9 未对它告警）
android.enableR8.fullMode=true
# ⚠️ 2026-09-30 已删除 `android.enableAapt2=true`：
#   AGP 9.0.1 明确报「It has been removed from the current version of the Android Gradle plugin.
#   This property has no effect, AAPT2 is now always used.」→ 纯死配置，删掉消一条告警、行为零变化。

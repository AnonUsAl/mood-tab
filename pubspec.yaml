name: mood_tab
description: "mood-tab 是一款专注于治愈与陪伴的跨平台个人情绪记录软件。本地数据库存储，100% 不上传云端。"
publish_to: 'none'
version: 3.0.17+48

environment:
  # flutter_local_notifications 22.x 与 timezone 0.10+ 都要求 Dart ^3.10.0
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.2

  # 本地数据库
  sqflite: ^2.4.1
  # 桌面端（Windows / Linux）没有 sqflite 实现，需要走 FFI 工厂
  sqflite_common_ffi: ^2.4.3
  path_provider: ^2.1.5
  path: ^1.9.0

  # 图表
  fl_chart: ^0.69.2

  # 本地通知（提醒功能）
  # 19.0.0 起才实现 Windows（Toast Notifications），18.x 在 Windows 上会抛
  # MissingPluginException，所以桌面端要真正能提醒就必须用 19+。
  flutter_local_notifications: ^22.3.1
  # Windows 的原生实现是独立的 FFI 插件。它本来就是主包的传递依赖，
  # 这里显式声明是为了确保 Windows 构建时一定完成 FFI 插件注册。
  flutter_local_notifications_windows: ^3.1.1
  # 22.x 的硬性要求是 ^0.11.0（旧版会解析冲突）
  timezone: ^0.11.1

  # 生物识别（隐私锁）
  local_auth: ^2.3.0

  # 本地存储（偏好设置）
  shared_preferences: ^2.3.3

  # PDF 导出
  pdf: ^3.11.2
  printing: ^5.14.2

  # 文件分享
  share_plus: ^10.1.4

  # 文件选择（数据恢复）
  file_picker: ^8.1.6

  # UI 增强
  cupertino_icons: ^1.0.8

  # WebView（心理测评套壳）
  webview_flutter: ^4.10.0

  # 拨打电话（危机支持热线）
  url_launcher: ^6.3.1

  # 读取版本号
  package_info_plus: ^8.1.2

  # 字体
  google_fonts: ^6.2.1

  # HTTP 请求
  http: ^1.2.1

  # 图片选择（情绪安全记录附图，仅本地存储）
  image_picker: ^1.1.2

  # 权限管理
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/about.html
